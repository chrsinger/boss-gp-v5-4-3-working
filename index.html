:root{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#1a2b40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142c49;color:white;padding:16px 18px;position:sticky;top:0;z-index:3}header strong{font-size:19px}header small{display:block;color:#c3d4e6;margin-top:3px}.wrap{max-width:1050px;margin:auto;padding:15px}nav{display:flex;gap:7px;overflow:auto;padding:12px 15px;background:white;position:sticky;top:73px;z-index:2;border-bottom:1px solid #dde4ee}button,.btn{border:0;border-radius:10px;padding:12px 15px;background:#e8eef6;color:#183454;font-weight:700;cursor:pointer;font-size:15px}button.active,button.primary{background:#1d527d;color:white}button.danger{background:#ffe0df;color:#a51d1d}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:12px;border:1px solid #c8d3df;border-radius:9px;font:inherit;background:white}textarea{min-height:80px}label{font-size:13px;font-weight:700;color:#40556b;display:block;margin:10px 0 5px}.card{background:white;border:1px solid #dfe5ed;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #1232 04}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:white;padding:17px;border-radius:13px;border:1px solid #e0e6ef}.metric b{display:block;font-size:30px}.metric span{font-size:12px;color:#52667c}.line{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.entry{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:white;border:1px solid #dbe3ed;margin:8px 0;padding:14px}.number{background:#e7eff7;border-radius:8px;min-width:54px;padding:10px;text-align:center;font-size:20px;font-weight:800}.grow{flex:1}.muted{color:#60758c;font-size:13px}.tag{display:inline-block;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:800}.OK{background:#c8f1d4;color:#13582d}.PENDING{background:#edf0f4;color:#4c5b6b}.FINDING{background:#ffd2d2;color:#8b1c1c}.OPEN_ITEM{background:#fff0bd;color:#765800}.WITHDRAWN{background:#d7d9de;color:#444}.wd{text-decoration:line-through}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}h2{font-size:20px;margin:8px 0 14px}h3{font-size:16px;margin:8px 0}.note{background:#fff4da;border-left:4px solid #e4a52c;padding:12px;border-radius:7px;margin:12px 0}.good{background:#e7f5eb;border-left:4px solid #2a8b4d;padding:12px;border-radius:7px}.small{font-size:12px}.hidden{display:none!important}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e0e5ec;text-align:left;padding:10px 7px;vertical-align:top}th{background:#e7eef7}#toast{position:fixed;bottom:18px;left:15px;right:15px;background:#1d527d;color:white;padding:13px;border-radius:9px;display:none;z-index:10}footer{padding:20px;text-align:center;color:#61768c;font-size:12px}@media(max-width:650px){.two{grid-template-columns:1fr}nav{top:73px}.wrap{padding:10px}.card{padding:12px}}@media print{header,nav,.no-print,button,footer{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:white}}

</style></head><body><header><strong>BOSS GP · SCRUTINEERING</strong><small>Offline PWA · V5.4.3 TEST · <span id="saveState" class="save-label">Not yet saved</span></small></header><nav id="tabs"></nav><main class="wrap" id="main"></main><footer>Prepared by Christian Singer · © 2026 Christian Singer · V5.4.3 TEST · © 2026 Christian Singer · All rights reserved · Local data only · Export backups regularly</footer><div id="toast"></div><script>const SEED={"version":"0.3-v5-master","event":"New Event","date":"","entries":[],"cars":[],"drivers":[],"findings":[],"history":[],"savedAt":null};
const KEY='bossgp-v541-multievent';const OLD_KEY='bossgp-v54-multievent';let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLD_KEY))||JSON.parse(localStorage.getItem('bossgp-v53-multievent'))||structuredClone(SEED)}catch(e){db=JSON.parse(JSON.stringify(SEED))}
// V5.3: shared masters and isolated per-event inspections. Legacy backup migrates losslessly.
function normalizeEvents(){if(!Array.isArray(db.events)){db.events=[{id:'event-legacy',name:db.event||'Le Castellet 2026',date:db.date||'',entries:db.entries||[],findings:db.findings||[],history:db.history||[],postChecks:db.postChecks||[],detectionReports:db.detectionReports||[],spareCars:db.spareCars||[],archived:false}];db.activeEventId='event-legacy'}if(!db.events.length){db.events=[{id:'event-first',name:'New Event',date:'',entries:[],findings:[],history:[],postChecks:db.postChecks||[],detectionReports:db.detectionReports||[],spareCars:db.spareCars||[],archived:false}];db.activeEventId='event-first'}db.events.forEach(e=>{if(!Array.isArray(e.postChecks))e.postChecks=[];if(!Array.isArray(e.detectionReports))e.detectionReports=[];if(!Array.isArray(e.spareCars))e.spareCars=[]});if(!Array.isArray(db.checkTemplates))db.checkTemplates=[];if(!db.events.some(e=>e.id===db.activeEventId))db.activeEventId=db.events[0].id;loadActiveEvent()}
function currentEvent(){return db.events.find(e=>e.id===db.activeEventId)}
function syncActiveEvent(){let e=currentEvent();if(e){e.entries=db.entries;e.findings=db.findings;e.history=db.history;e.postChecks=db.postChecks||[];e.detectionReports=db.detectionReports||[];e.spareCars=db.spareCars||[];e.name=db.event;e.date=db.date}}
function loadActiveEvent(){let e=currentEvent();db.event=e.name;db.date=e.date;db.entries=e.entries;db.findings=e.findings;db.history=e.history||[];db.postChecks=e.postChecks||[];db.detectionReports=e.detectionReports||[];db.spareCars=e.spareCars||[]}
function eventPage(){syncActiveEvent();return `<div class="line"><h2>Events</h2><button class="primary" onclick="newEvent()">+ New Event</button></div><div class="note">Car and driver equipment masters are shared across events. Inspections and findings remain separate. Back up the complete database regularly.</div>${db.events.map(e=>`<div class="card"><div class="line"><h3>${esc(e.name)} ${e.archived?'· Archived':''}</h3>${e.id===db.activeEventId?'<b>Active</b>':`<button onclick="switchEvent('${e.id}')">Open Event</button>`}</div><p>${esc(e.date)} · ${e.entries.length} entries · ${e.findings.length} findings</p><button onclick="toggleArchive('${e.id}')">${e.archived?'Unarchive':'Archive'} event</button></div>`).join('')}`}
function newEvent(){let name=prompt('New event name (e.g. Red Bull Ring 2027)');if(!name?.trim())return;let date=prompt('Event date / range (e.g. 14–16 May 2027)','')||'';syncActiveEvent();let id='event-'+Date.now();db.events.push({id,name:name.trim(),date,entries:[],findings:[],history:[],postChecks:[],detectionReports:[],spareCars:[],archived:false});db.activeEventId=id;loadActiveEvent();save();go('dashboard')}
function switchEvent(id){if(id===db.activeEventId)return;syncActiveEvent();db.activeEventId=id;loadActiveEvent();save();go('dashboard')}
function toggleArchive(id){let e=db.events.find(x=>x.id===id);if(!e)return;e.archived=!e.archived;save();render()}
normalizeEvents();
// IndexedDB is the primary durable mirror; localStorage is retained as a fallback and migration path.
let idbReady=null;try{if('indexedDB' in window){idbReady=new Promise((resolve,reject)=>{let req=indexedDB.open('bossgp-v541',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});idbReady.then(database=>{let tx=database.transaction('data','readonly'),r=tx.objectStore('data').get('database');r.onsuccess=()=>{if(r.result&&!localStorage.getItem(KEY)){db=r.result;normalizeEvents();render();save()}}}).catch(()=>{})}}catch(e){idbReady=null}
function saveIDB(){if(!idbReady)return;idbReady.then(database=>{let tx=database.transaction('data','readwrite');tx.objectStore('data').put(structuredClone(db),'database');tx.onerror=()=>console.error('IndexedDB write failed',tx.error)}).catch(e=>console.error('IndexedDB unavailable',e))}
function formatDateTime(v){if(!v)return '—';let d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(',',' ·')}
function formatDate(v){if(!v)return '—';let d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function surnameSort(a,b){let name=x=>String(x.name||'').trim().split(/\s+/);let x=name(a),y=name(b);return (x.at(-1)||'').localeCompare(y.at(-1)||'','en',{numeric:true,sensitivity:'base'})||a.name.localeCompare(b.name)}
function chassisSort(a,b){return String(a.chassis||'').localeCompare(String(b.chassis||''),'en',{numeric:true,sensitivity:'base'})}
function normalizeExpiry(v,yearOnly){v=String(v||'').trim();if(!v)return '';if(yearOnly){let m=v.match(/(?:19|20)\d{2}/);return m?m[0]:v}let iso=v.match(/^((?:19|20)\d{2})[-/.](0?[1-9]|1[0-2])(?:[-/.]\d{1,2})?$/);if(iso)return iso[2].padStart(2,'0')+'/'+iso[1];let eu=v.match(/^(0?[1-9]|1[0-2])[-/.]((?:19|20)\d{2})$/);if(eu)return eu[1].padStart(2,'0')+'/'+eu[2];let full=v.match(/^(?:\d{1,2})[-/.](0?[1-9]|1[0-2])[-/.]((?:19|20)\d{2})$/);return full?full[1].padStart(2,'0')+'/'+full[2]:v}
function expiryInput(k,v){let year=k==='beltsValid';return `<div><label>${k==='fuelValid'?'Fuel cell expiry':k==='extValid'?'Extinguisher expiry':'Belts expiry'} (${year?'YYYY':'MM/YYYY'})</label><input data-key="car:${k}" value="${esc(normalizeExpiry(v,year))}" inputmode="numeric" placeholder="${year?'2029':'06/2028'}" pattern="${year?'(19|20)[0-9]{2}':'(0[1-9]|1[0-2])/(19|20)[0-9]{2}'}"></div>`}
function validateExpiry(v,k){return !v|| (k==='beltsValid'?/^(19|20)\d{2}$/:/^(0[1-9]|1[0-2])\/(19|20)\d{2}$/).test(v)}
let page='dashboard',selected=null,query='';const checks=['Fuel Cell','Extinguisher','Belts','Rain Light','Wheel Tethers','Master Switch','Mirrors','Towing Device','Seat / Cockpit / Headrest'];const gear=['helmet','fhr','overall','upper','bottom','socks','gloves','balaclava','shoes'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getCar=e=>db.cars.find(c=>c.chassis&&c.chassis.toUpperCase()===String(e.chassis||'').toUpperCase());const getDriver=e=>db.drivers.find(d=>d.name.toLowerCase()===e.driver.toLowerCase());const logFor=e=>db.findings.filter(f=>f.no===e.no);const unresolved=e=>logFor(e).filter(f=>!['CLOSED','RESOLVED'].includes(f.status));function previousIssues(chassis){if(!chassis)return[];syncActiveEvent();return(db.events||[]).filter(ev=>ev.id!==db.activeEventId).flatMap(ev=>(ev.findings||[]).filter(f=>String(f.chassis||'').trim().toLowerCase()===String(chassis).trim().toLowerCase()&&!['CLOSED','RESOLVED'].includes(f.status)).map(f=>({...f,originEvent:ev.name,originEventId:ev.id}))).sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')))}
function previousWarning(e){let items=previousIssues(e.chassis);return items.length?`<div class="note"><b>⚠ ${items.length} unresolved item(s) from previous events for ${esc(e.chassis)}</b><div>${items.map(f=>`<p><b>${esc(f.originEvent)}</b> · ${badge(f.type)} · ${esc(f.item||'Other')}: ${esc(f.text||'')}</p>`).join('')}</div><button onclick="go('findings');findingView='previous';render()">Review previous findings</button></div>`:''}
function removeEventEntry(no){let e=db.entries.find(x=>x.no===no);if(!e)return;let linked=db.findings.filter(f=>f.no===no);let message=linked.length?`Remove #${no} from the current entry list? ${linked.length} finding(s) exist and will remain in the event history. The entry will be marked WITHDRAWN instead of deleted.`:`Remove #${no} from this event entry list? Master records will not be deleted.`;if(!confirm(message))return;if(linked.length||Object.values(e.checks||{}).some(v=>v!=='NOT CHECKED')||e.vehicle!=='PENDING'||e.equipment!=='PENDING'){e.withdrawn=true;toast('Entry withdrawn; history preserved')}else{db.entries=db.entries.filter(x=>x!==e);toast('Event entry removed')}save();go('entries')}
function inspectionPoints(e){return [...checks.map(k=>e.checks?.[k]||'NOT CHECKED'),e.vehicle||'PENDING',e.equipment||'PENDING']}
function status(e){if(e.withdrawn)return'WITHDRAWN';let p=inspectionPoints(e),f=unresolved(e);if(p.includes('FINDING')||f.some(x=>x.type==='FINDING'))return'FINDING';if(p.includes('OPEN ITEM')||f.some(x=>x.type==='OPEN ITEM'))return'OPEN ITEM';if(p.some(x=>x==='PENDING'||x==='NOT CHECKED'||!x))return'PENDING';return'OK'}function badge(v){return `<span class="tag ${v.replace(/ /g,'_')}">${esc(v)}</span>`}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function save(){syncActiveEvent();db.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveState').textContent='Saved '+formatDateTime(new Date());saveIDB()}catch(e){alert('Local storage failed! Export a JSON backup now. '+e.message)}}function btnTab(p,name){return `<button class="${page===p?'active':''}" onclick="go('${p}')">${name}</button>`}function go(p){page=p;selected=null;addCarOpen=false;query='';render()}function counts(){let x={entries:db.entries.length,OK:0,PENDING:0,FINDING:0,'OPEN ITEM':0,WITHDRAWN:0};db.entries.forEach(e=>x[status(e)]++);return x}function render(){document.getElementById('tabs').innerHTML=btnTab('events','Events')+btnTab('dashboard','Dashboard')+btnTab('entries','Initial Scrutineering')+btnTab('findings','Findings')+btnTab('postchecks','Post Session Checks')+btnTab('masters','Master Data')+btnTab('reports','Reports')+btnTab('backup','Backup / Export');let h='';if(page==='events')h=eventPage();if(page==='dashboard')h=dashboard();if(page==='entries')h=addCarOpen?addCarPage():(selected?editEntry():entryList());if(page==='findings')h=findingsPage();if(page==='postchecks')h=postChecksPage();if(page==='masters')h=mastersPage();if(page==='reports')h=reportsPage();if(page==='backup')h=backupPage();document.getElementById('main').innerHTML=h}function dashboard(){let c=counts();return `<h2>${esc(db.event)} · Live Status</h2><div class="grid">${[['Entries',c.entries],['OK',c.OK],['Pending',c.PENDING],['Findings',c.FINDING],['Open Items',c['OPEN ITEM']],['Withdrawn',c.WITHDRAWN]].map(([a,b])=>`<div class="metric"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="card"><h3>Start numbers</h3><div class="grid">${db.entries.map(e=>`<button class="entry" onclick="selectEntry('${e.no}')"><span class="number ${e.withdrawn?'wd':''}">${e.no}</span><span class="grow"><b>${esc(e.driver)}</b><br><span class="muted">${esc(e.class)} · ${esc(e.chassis||'Chassis not confirmed')}</span></span>${badge(status(e))}${previousIssues(e.chassis).length?`<span class="tag OPEN_ITEM">⚠ Previous ${previousIssues(e.chassis).length}</span>`:''}</button>`).join('')}</div></div><div class="note">Import your private JSON file under Backup / Export before starting. Confirm persistence and JSON restore on the actual iPad before relying on it. Export a backup frequently.</div>`}function entryList(){return `<div class="line"><h2>Initial Scrutineering · ${db.entries.length} entries</h2><button class="primary" onclick="addCarForm()">+ Add Car</button></div><input placeholder="Search number, driver, chassis…" value="${esc(query)}" oninput="query=this.value;refreshList()" id="entrySearch"><div id="entryRows">${entryRows()}</div>`}function entryRows(){return db.entries.filter(e=>[e.no,e.driver,e.chassis,e.team].join(' ').toLowerCase().includes(query.toLowerCase())).map(e=>`<button class="entry" onclick="selectEntry('${e.no}')"><span class="number ${e.withdrawn?'wd':''}">${e.no}</span><span class="grow"><b>${esc(e.driver)}</b><br><span class="muted">${esc(e.team)} · ${esc(e.chassis||'chassis unconfirmed')}</span></span>${badge(status(e))}</button>`).join('')}function refreshList(){document.getElementById('entryRows').innerHTML=entryRows()}function selectEntry(no){selected=no;page='entries';render()}let addCarOpen=false;
function addCarForm(){selected=null;addCarOpen=true;page='entries';render()}
function masterDatalists(){return `<datalist id="allChassis">${db.cars.filter(c=>c.chassis).slice().sort(chassisSort).map(c=>`<option value="${esc(c.chassis)}">${esc(c.make||'')} ${esc(c.model||'')}</option>`).join('')}</datalist><datalist id="allDrivers">${db.drivers.slice().sort(surnameSort).map(d=>`<option value="${esc(d.name)}"></option>`).join('')}</datalist>`}
function addCarPage(){let cars=db.cars.filter(c=>c.chassis).slice().sort(chassisSort);let opts=cars.map(c=>`<option value="${esc(c.chassis)}">${esc(c.chassis)} — ${esc(c.make||'')} ${esc(c.model||'')}</option>`).join('');let entries=db.entries.map(e=>`<option value="${esc(e.no)}">#${esc(e.displayNo||e.no)} · ${esc(e.driver)} · ${esc(e.chassis||'unconfirmed')}</option>`).join('');return `<div class="line"><h2>Add Car to Event</h2><button onclick="go('entries')">← Back</button></div><div class="card"><p class="muted">Chassis number uniquely identifies the vehicle in CARS. A new event entry is created for each inspection. Existing vehicle master data are reused, not duplicated.</p>${masterDatalists()}<form id="addCarForm" onsubmit="createCarEntry(event)"><div class="two"><div><label>Vehicle source</label><select id="acSource" onchange="addCarMode()"><option value="existing">Existing car from CARS</option><option value="new">New car</option></select></div><div><label>Arrangement</label><select id="acArrangement" onchange="addCarMode()"><option value="NORMAL">Normal entry</option><option value="SHARED">Shared car — same chassis, another driver/start number</option><option value="SPARE">Spare car — another chassis for existing entry</option></select></div></div><div id="acExisting"><label>Select existing chassis</label><input id="acExistingChassis" list="acChassisList" onchange="prefillAddCar()" oninput="prefillAddCar()" placeholder="Type or select chassis" autocomplete="off"><datalist id="acChassisList">${opts}</datalist></div><div id="acNew" class="hidden"><div class="two"><div><label>Chassis number *</label><input id="acChassis" list="allChassis" autocomplete="off"></div><div><label>Manufacturer</label><input id="acMake"></div><div><label>Model</label><input id="acModel"></div><div><label>Car passport</label><input id="acPass"></div></div></div><div id="acRelated" class="hidden"><label>Related event entry</label><select id="acRelatedEntry"><option value="">Select entry</option>${entries}</select></div><div class="two"><div><label>Start number *</label><input id="acNo" required autocomplete="off" placeholder="e.g. 77"></div><div><label>Driver *</label><input id="acDriver" required autocomplete="off" list="acDrivers"><datalist id="acDrivers">${db.drivers.slice().sort(surnameSort).map(d=>`<option value="${esc(d.name)}"></option>`).join('')}</datalist></div><div><label>Class</label><input id="acClass" oninput="this.dataset.userEdited='1'"></div><div><label>Team</label><input id="acTeam" oninput="this.dataset.userEdited='1'"></div></div><div class="note" id="acHint">Select a chassis from the master database.</div><div class="actions"><button class="primary" type="submit">Save & Add Car</button><button type="button" onclick="go('entries')">Cancel</button></div></form></div>`}
function prefillAddCar(){let ch=document.getElementById('acExistingChassis')?.value.trim();let car=db.cars.find(c=>c.chassis?.toLowerCase()===ch?.toLowerCase());if(!car)return;let entry=db.events.flatMap(e=>e.entries||[]).find(e=>e.chassis?.toLowerCase()===ch.toLowerCase());let cls=document.getElementById('acClass'),team=document.getElementById('acTeam');if(cls&&!cls.dataset.userEdited)cls.value=car.class||entry?.class||'';if(team&&!team.dataset.userEdited)team.value=car.team||entry?.team||''}
function addCarMode(){let source=document.getElementById('acSource')?.value,arr=document.getElementById('acArrangement')?.value;document.getElementById('acExisting').classList.toggle('hidden',source!=='existing');document.getElementById('acNew').classList.toggle('hidden',source!=='new');document.getElementById('acRelated').classList.toggle('hidden',arr==='NORMAL');document.getElementById('acHint').textContent=arr==='SPARE'?'Spare: create a separate inspection record for the additional chassis; its event number is recorded as number-S2, -S3 etc. The related entry is retained.':arr==='SHARED'?'Shared: same chassis may be linked to another driver/start number; the car master is not duplicated.':'Normal: add a car and its event entry.'}
function createCarEntry(ev){ev.preventDefault();let val=id=>document.getElementById(id)?.value.trim()||'';let source=val('acSource'),arr=val('acArrangement'),related=arr==='NORMAL'?null:db.entries.find(e=>e.no===val('acRelatedEntry'));if(arr!=='NORMAL'&&!related)return alert('Select the related event entry.');let chassis=source==='existing'?val('acExistingChassis'):val('acChassis');if(!chassis)return alert('Chassis number is required.');let car=db.cars.find(c=>c.chassis?.toLowerCase()===chassis.toLowerCase());if(source==='new'&&car)return alert('Chassis already exists. Select Existing Car instead.');if(source==='existing'&&!car)return alert('Select an existing chassis.');if(arr==='SHARED'&&related.chassis.toLowerCase()!==chassis.toLowerCase())return alert('Shared car must use the same chassis as the related entry.');if(arr==='SPARE'&&related.chassis.toLowerCase()===chassis.toLowerCase())return alert('Spare car requires a different chassis.');let no=val('acNo'),driver=val('acDriver');if(!no||!driver)return alert('Start number and driver are required.');if(arr==='SPARE'){if(no!==related.no&&no!==related.displayNo)return alert('For a spare car, enter the start number of the related entry.');let n=2;while(db.entries.some(e=>e.no===`${related.no}-S${n}`))n++;no=`${related.no}-S${n}`}else if(db.entries.some(e=>e.no===no))return alert('Start number already exists. For a spare car, choose SPARE.');if(source==='new'){car={id:'CAR-'+Date.now(),chassis,make:val('acMake'),model:val('acModel'),pass:val('acPass'),class:val('acClass'),fuelNo:'',fuelValid:'',extValid:'',beltsValid:'',notes:''};db.cars.push(car)}if(!db.drivers.some(d=>d.name?.toLowerCase()===driver.toLowerCase()))db.drivers.push({id:'DR-'+Date.now(),name:driver});db.entries.push({no,displayNo:arr==='SPARE'?related.no:no,relatedNo:related?.no||'',driver,class:val('acClass')||car.class||'',team:val('acTeam')||car.team||'',make:car.make||'',model:car.model||'',chassis,arrangement:arr,vehicle:'PENDING',equipment:'PENDING',withdrawn:false,checks:{},notes:arr==='SPARE'?`Spare car for entry #${related.no}`:arr==='SHARED'?`Shared chassis with entry #${related.no}`:''});addCarOpen=false;save();selected=no;render();toast('Car added to event and master data updated')}

function addEntry(){let no=prompt('New start number');if(!no||db.entries.some(e=>e.no===no))return alert('Missing or duplicate number');db.entries.push({no,driver:'New Driver',class:'',team:'',make:'',model:'',chassis:'',suggestedChassis:'',arrangement:'NORMAL',vehicle:'PENDING',equipment:'PENDING',withdrawn:false,checks:{},notes:''});save();selectEntry(no)}function field(label,key,val,options){return `<div><label>${label}</label>${options?`<select data-key="${key}" ${key.startsWith('check:')||key==='vehicle'||key==='equipment'?'onchange="inspectionStatusChanged(this)"':''}>${options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input data-key="${key}" ${key==='driver'?'list="allDrivers"':key==='chassis'?'list="allChassis"':''} value="${esc(val)}">`}</div>`}function editEntry(){let e=db.entries.find(x=>x.no===selected),car=getCar(e),drv=getDriver(e);return `<div class="line"><h2>#${esc(e.displayNo||e.no)} · ${esc(e.driver)}</h2>${badge(status(e))}</div><button class="no-print" onclick="go('entries')">← All Entries</button>${previousWarning(e)}<div class="actions"><button class="danger" onclick="removeEventEntry(selected)">Remove / Withdraw from Event</button></div>

function lookupChassis(){let v=document.querySelector('[data-key=chassis]')?.value.trim(),c=db.cars.find(c=>c.chassis?.toLowerCase()===v?.toLowerCase());if(!v)return alert('Enter a chassis number first');if(!c)return toast('Unknown chassis — enter details and save to master');for(let k of ['make','model','pass','fuelNo','fuelValid','extValid','beltsValid']){let el=document.querySelector('[data-key="car:'+k+'"]');if(el)el.value=['fuelValid','extValid','beltsValid'].includes(k)?normalizeExpiry(c[k],k==='beltsValid'):c[k]||''}toast('Car master loaded')};function lookupDriver(){let v=document.querySelector('[data-key=driver]')?.value.trim(),d=db.drivers.find(d=>d.name?.toLowerCase()===v?.toLowerCase());if(!v)return alert('Enter driver name first');if(!d)return toast('Unknown driver — enter equipment and save to master');for(let k of gear){let el=document.querySelector('[data-key="gear:'+k+'"]');if(el)el.value=d[k]||''}toast('Driver equipment loaded')};function allOK(){if(!confirm('Set all unmarked inspection points to OK? Existing Findings and Open Items will be kept.'))return;document.querySelectorAll('[data-key^="check:"], [data-key="vehicle"], [data-key="equipment"]').forEach(el=>{if(!['FINDING','OPEN ITEM'].includes(el.value))el.value='OK'});saveEntry();toast('ALL OK applied; individual checks remain editable')}
function saveInlineFinding(){let t=document.getElementById('findingText'),item=document.getElementById('findingItem').value,type=document.getElementById('findingType').value,description=t.value.trim();if(!description){alert('Please enter a finding description.');t.focus();return}let e=db.entries.find(x=>x.no===selected);if(!e)return;if(!saveEntry(false))return;e=db.entries.find(x=>x.no===selected);if(item!=='Other'){if(checks.includes(item))e.checks[item]=type;else if(item==='Vehicle result')e.vehicle=type;else if(item==='Driver equipment result')e.equipment=type}if(db.findings.some(f=>f.no===e.no&&f.item===item&&!['RESOLVED','CLOSED'].includes(f.status))){alert('An unresolved finding already exists for this inspection item. Edit it in Findings.');return}db.findings.push({id:'F-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),no:e.no,chassis:e.chassis,item,type,text:description,status:'OPEN',created:new Date().toISOString(),closed:'',followup:''});save();render();toast('Finding saved')}
function assignSuggested(){let e=db.entries.find(x=>x.no===selected);e.chassis=e.suggestedChassis;save();render()}function saveEntry(refresh=true){let e=db.entries.find(x=>x.no===selected);if(!e)return false;let oldNo=e.no,oldChassis=e.chassis,oldDriver=e.driver;let data={};document.querySelectorAll('[data-key]').forEach(el=>data[el.dataset.key]=el.value);let newNo=String(data.no||'').trim(),newChassis=String(data.chassis||'').trim(),newDriver=String(data.driver||'').trim();for(let k of ['fuelValid','extValid','beltsValid']){let v=String(data['car:'+k]||'').trim();if(!validateExpiry(v,k)){alert('Invalid '+k+': use '+(k==='beltsValid'?'YYYY':'MM/YYYY'));return false}}if(!newNo||!newDriver){alert('Start number and driver are required');return false}if(newNo!==oldNo&&db.entries.some(x=>x!==e&&x.no===newNo)){alert('Duplicate start number');return false}if(newChassis!==oldChassis&&oldChassis&&!confirm('Change chassis from '+oldChassis+' to '+newChassis+'? This changes the vehicle master link.'))return false;
let existingCar=db.cars.find(c=>c.chassis&&c.chassis.toLowerCase()===newChassis.toLowerCase());if(!existingCar&&newChassis){existingCar={id:'CAR-'+Date.now(),chassis:newChassis};db.cars.push(existingCar)}
let driver=db.drivers.find(d=>d.name?.toLowerCase()===newDriver.toLowerCase());if(!driver){driver={id:'DR-'+Date.now(),name:newDriver};db.drivers.push(driver)}
let pendingFindings=[];for(let [key,value] of Object.entries(data)){let item=key.startsWith('check:')?key.slice(6):key==='vehicle'?'Vehicle result':key==='equipment'?'Driver equipment result':null;if(!item||!['FINDING','OPEN ITEM'].includes(value))continue;let old=key.startsWith('check:')?(e.checks||{})[item]:e[key];let linked=db.findings.some(f=>f.no===oldNo&&f.item===item&&!['RESOLVED','CLOSED'].includes(f.status));if(old===value&&linked)continue;if(old===value&&!linked){/* imported old finding without log: create a linked record */}let description=prompt('Describe '+value+' for '+item+' (required):','');if(description===null)return false;if(!description.trim()){alert('A description is required for '+value+'. Nothing was saved.');return false}pendingFindings.push({id:'F-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),no:newNo,chassis:newChassis,item,type:value,text:description.trim(),status:'OPEN',created:new Date().toISOString(),resolved:'',followup:''})}
for(let [k,v] of Object.entries(data)){if(k.startsWith('check:'))e.checks[k.slice(6)]=v;else if(k.startsWith('gear:'))driver[k.slice(5)]=v;else if(k.startsWith('car:')){if(existingCar)existingCar[k.slice(4)]=v}else e[k]=v}if(existingCar){existingCar.class=e.class;e.make=existingCar.make||e.make;e.model=existingCar.model||e.model}e.withdrawn=!!document.querySelector('[data-check="withdrawn"]')?.checked;if(newNo!==oldNo){db.findings.filter(f=>f.no===oldNo).forEach(f=>f.no=newNo);selected=newNo}if(newChassis!==oldChassis){let related=db.findings.filter(f=>f.no===e.no);if(related.length){related.forEach(f=>{if(!f.chassis)f.chassis=oldChassis});toast('Existing findings retain their original chassis association')}}for(let [key,value] of Object.entries(data)){let item=key.startsWith('check:')?key.slice(6):key==='vehicle'?'Vehicle result':key==='equipment'?'Driver equipment result':null;if(!item||!['OK','N/A'].includes(value))continue;let matches=db.findings.filter(f=>f.no===oldNo&&f.item===item&&!['RESOLVED','CLOSED'].includes(f.status));if(matches.length){if(confirm(`Mark ${matches.length} linked finding(s) for ${item} as RESOLVED because the inspection is ${value}?`)){matches.forEach(f=>{f.status='RESOLVED';f.resolved=new Date().toISOString();f.closed=f.resolved;f.followup=(f.followup?f.followup+' | ':'')+'Verified at Initial Scrutineering'})}else{if(checks.includes(item))e.checks[item]=matches.some(f=>f.type==='FINDING')?'FINDING':'OPEN ITEM';else if(item==='Vehicle result')e.vehicle=matches[0].type;else if(item==='Driver equipment result')e.equipment=matches[0].type}}}db.findings.push(...pendingFindings);save();if(refresh){render();toast('Inspection and master data saved')}return true}
function addFinding(no){selected=no;page='entries';render();document.getElementById('findingText')?.focus()}
let findingView='current',findingHistoryFilter='unresolved';
function findingRows(items,history){return items.map(f=>`<tr><td><b>#${esc(f.no||'—')}</b><br>${esc(f.chassis||'')}${history?`<br><small>${esc(f.originEvent||'')}</small>`:''}<br>${esc(f.item||'Other')}</td><td>${badge(f.type||'OPEN ITEM')}<p>${esc(f.text||'')}</p><small>Created: ${esc(formatDateTime(f.created))}</small></td><td><select aria-label="Finding status" onchange="${history?`changePreviousFinding('${f.originEventId}','${f.id}',this.value)`:`changeFinding('${f.id}',this.value)`}">${['OPEN','RESOLVED'].map(v=>`<option value="${v}" ${v===(['CLOSED','RESOLVED'].includes(f.status)?'RESOLVED':'OPEN')?'selected':''}>${v}</option>`).join('')}</select></td><td><textarea aria-label="Follow-up" onblur="${history?`changePreviousFollowup('${f.originEventId}','${f.id}',this.value)`:`changeFollowup('${f.id}',this.value)`}" placeholder="Rectification note">${esc(f.followup||'')}</textarea>${['CLOSED','RESOLVED'].includes(f.status)?`<small>Resolved: ${esc(formatDateTime(f.resolved||f.closed))}${f.resolvedAtEvent?' · '+esc(f.resolvedAtEvent):''}</small>`:''}</td></tr>`).join('')}
function findingsPage(){syncActiveEvent();let history=(db.events||[]).filter(ev=>ev.id!==db.activeEventId).flatMap(ev=>(ev.findings||[]).map(f=>({...f,originEvent:ev.name,originEventId:ev.id})));let current=(db.findings||[]).map(f=>({...f,originEvent:db.event,originEventId:db.activeEventId}));let list=findingView==='current'?current:findingView==='previous'?history:[...current,...history];if(findingView==='previous'&&findingHistoryFilter==='participating'){let chassis=new Set(db.entries.map(e=>String(e.chassis||'').toLowerCase()));list=list.filter(f=>chassis.has(String(f.chassis||'').toLowerCase())&&f.chassis)}if(findingHistoryFilter==='unresolved')list=list.filter(f=>!['CLOSED','RESOLVED'].includes(f.status));list.sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));return `<h2>Findings / Open Items</h2><div class="card"><div class="actions"><button class="${findingView==='current'?'primary':''}" onclick="findingView='current';render()">Current Event</button><button class="${findingView==='previous'?'primary':''}" onclick="findingView='previous';render()">Previous Events</button><button class="${findingView==='all'?'primary':''}" onclick="findingView='all';render()">All Findings</button></div><div class="two"><div><label>Status filter</label><select onchange="findingHistoryFilter=this.value;render()"><option value="unresolved" ${findingHistoryFilter==='unresolved'?'selected':''}>Unresolved only</option><option value="all" ${findingHistoryFilter==='all'?'selected':''}>All statuses</option>${findingView==='previous'?`<option value="participating" ${findingHistoryFilter==='participating'?'selected':''}>Cars entered at current event</option>`:''}</select></div></div><p class="muted">${findingView==='current'?'Findings created at '+esc(db.event):findingView==='previous'?'Historical findings retain their original event association.':'Complete event history.'} Resolving a previous item records the current event as the rectification location without rewriting the old inspection.</p>${findingView==='current'?'<button onclick="newFinding()">+ Add Finding</button>':''}<div style="overflow-x:auto"><table><thead><tr><th>No. / Item</th><th>Type / Description</th><th>Status</th><th>Follow-up / Time</th></tr></thead><tbody>${findingRows(list,findingView!=='current')}</tbody></table></div>${!list.length?'<p>No matching findings.</p>':''}</div>`}
function changePreviousFinding(eventId,id,v){let ev=db.events.find(e=>e.id===eventId),f=ev?.findings?.find(x=>x.id===id);if(!f)return;if(!confirm(`Change historical finding from ${ev.name} to ${v}? The original inspection status will remain unchanged.`)){render();return}f.status=v;if(v==='RESOLVED'){f.resolved=new Date().toISOString();f.closed=f.resolved;f.resolvedAtEvent=db.event}else{f.resolved='';f.closed='';f.resolvedAtEvent=''}save();render();toast('Historical finding updated; original inspection preserved')}
function changePreviousFollowup(eventId,id,v){let f=db.events.find(e=>e.id===eventId)?.findings?.find(x=>x.id===id);if(f&&f.followup!==v){f.followup=v;save();toast('Follow-up saved')}}
function newFinding(){let no=prompt('Start number');if(no&&db.entries.some(e=>e.no===no))addFinding(no);else if(no)alert('Unknown start number')}
function changeFinding(id,v){let f=db.findings.find(x=>x.id===id);if(!f)return;let prev=f.status;f.status=v;if(v==='RESOLVED'){f.resolved=new Date().toISOString();f.closed=f.resolved;let e=db.entries.find(x=>x.no===f.no);let others=db.findings.some(x=>x!==f&&x.no===f.no&&x.item===f.item&&!['CLOSED','RESOLVED'].includes(x.status));if(e&&!others){if(checks.includes(f.item)&&['FINDING','OPEN ITEM'].includes(e.checks?.[f.item]))e.checks[f.item]='OK';else if(f.item==='Vehicle result'&&['FINDING','OPEN ITEM'].includes(e.vehicle))e.vehicle='OK';else if(f.item==='Driver equipment result'&&['FINDING','OPEN ITEM'].includes(e.equipment))e.equipment='OK'}}else{f.resolved='';f.closed=''}save();render();toast(v==='RESOLVED'?'Finding resolved and saved':'Finding reopened and saved')}
function changeFollowup(id,v){let f=db.findings.find(x=>x.id===id);if(f&&f.followup!==v){f.followup=v;save();toast('Follow-up saved')}}
let masterEdit=null;function mastersPage(){return `<h2>Master Data</h2><div class="note">${db.cars.length} cars · ${db.drivers.length} drivers. Tap a record to edit. Changes are saved locally; export a JSON backup regularly.</div>${masterEdit?masterEditor():`<div class="card"><h3>Cars</h3><input placeholder="Search chassis, car or pass" oninput="document.getElementById('carRows').innerHTML=masterRows('cars',this.value)"><div id="carRows">${masterRows('cars','')}</div><button onclick="newMaster('cars')">+ New Car</button></div><div class="card"><h3>Drivers</h3><input placeholder="Search driver" oninput="document.getElementById('driverRows').innerHTML=masterRows('drivers',this.value)"><div id="driverRows">${masterRows('drivers','')}</div><button onclick="newMaster('drivers')">+ New Driver</button></div>`}`}
function masterRows(type,q){let arr=db[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase())).sort(type==='cars'?chassisSort:surnameSort);return arr.map(x=>`<button class="entry" onclick="editMaster('${type}',${db[type].indexOf(x)})"><b>${esc(type==='cars'?x.chassis:x.name)}</b><span class="grow muted">${type==='cars'?esc(x.make+' '+x.model):''}</span>✎</button>`).join('')||'<p class="muted">No matching records</p>'}
function editMaster(type,i){masterEdit={type,index:i,record:{...db[type][i]}};render();window.scrollTo(0,0)}
function newMaster(type){masterEdit={type,index:-1,record:type==='cars'?{id:'NEW-'+Date.now(),chassis:'',class:'',make:'',model:'',pass:'',fuelNo:'',fuelValid:'',extValid:'',beltsValid:'',notes:''}:{id:'NEW-'+Date.now(),name:'',notes:''}};render();window.scrollTo(0,0)}
function masterEditor(){let {type,index,record}=masterEdit;let fields=type==='cars'?[['chassis','Chassis No. *'],['class','Class'],['make','Manufacturer'],['model','Model'],['pass','Car passport'],['fuelNo','Fuel cell number'],['fuelValid','Fuel cell expiry'],['extValid','Extinguisher expiry'],['beltsValid','Belts expiry'],['notes','Notes']]:[['name','Driver name *'],...gear.map(k=>[k,k.replace(/([A-Z])/g,' $1')]),['notes','Notes']];return `<div class="card"><h3>${index<0?'Add':'Edit'} ${type==='cars'?'Car':'Driver'}</h3><p class="muted">${type==='cars'?'Chassis number is the unique vehicle identifier.':'Driver name must be unique.'}</p><form id="masterForm" onsubmit="saveMaster(event)"><div class="grid">${fields.map(([key,label])=>`<div style="${key==='notes'?'grid-column:1/-1':''}"><label for="mf_${key}">${esc(label)}</label>${key==='notes'?`<textarea id="mf_${key}" name="${key}">${esc(record[key]||'')}</textarea>`:`<input id="mf_${key}" name="${key}" value="${esc(['fuelValid','extValid','beltsValid'].includes(key)?normalizeExpiry(record[key],key==='beltsValid'):record[key]||'')}" ${key==='chassis'||key==='name'?'required':''} autocomplete="off">`}</div>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="primary" type="submit">Save ${type==='cars'?'Car':'Driver'}</button><button type="button" onclick="cancelMaster()">Cancel</button></div></form></div>`}
function saveMaster(ev){ev.preventDefault();let {type,index,record}=masterEdit;let f=document.getElementById('masterForm');let x={...record};for(let el of f.elements){if(el.name)x[el.name]=el.value.trim()}let key=type==='cars'?'chassis':'name';if(type==='cars'){for(let k of ['fuelValid','extValid','beltsValid'])if(!validateExpiry(x[k],k)){alert('Invalid '+k+': use '+(k==='beltsValid'?'YYYY':'MM/YYYY'));return}}if(!x[key]){alert('Required: '+key);return}if(db[type].some((item,i)=>i!==index&&String(item[key]||'').trim().toLowerCase()===x[key].toLowerCase())){alert('Duplicate '+(type==='cars'?'chassis number':'driver name')+'. Record was not saved.');return}if(type==='cars'&&index>=0&&record.chassis!==x.chassis&&db.entries.some(e=>e.chassis===record.chassis)){if(!confirm('This chassis is linked to event entries. Update these entries to the new chassis number?'))return;db.entries.forEach(e=>{if(e.chassis===record.chassis)e.chassis=x.chassis})}if(type==='drivers'&&index>=0&&record.name!==x.name&&db.entries.some(e=>e.driver===record.name)){if(!confirm('This driver is linked to event entries. Update these entries to the new name?'))return;db.entries.forEach(e=>{if(e.driver===record.name)e.driver=x.name})}if(index<0)db[type].push(x);else db[type][index]=x;masterEdit=null;save();render();toast('Master data saved')}

function reportRows(kind){let rows=[];if(kind==='summary'){rows=[['No.','Driver','Class','Chassis','Status'],...db.entries.map(e=>[e.no,e.driver,e.class,e.chassis,status(e)])]}if(kind==='cars'){rows=[['No.','Driver','Chassis','Vehicle','Fuel expiry','Ext. expiry','Belts expiry','Result'],...db.entries.map(e=>{let c=getCar(e)||{};return[e.no,e.driver,e.chassis,(c.make||e.make)+' '+(c.model||e.model),normalizeExpiry(c.fuelValid,false),normalizeExpiry(c.extValid,false),normalizeExpiry(c.beltsValid,true),e.vehicle]})]}if(kind==='equipment'){rows=[['No.','Driver',...gear.map(k=>k.toUpperCase()),'Result'],...db.entries.map(e=>{let d=getDriver(e)||{};return[e.no,e.driver,...gear.map(k=>d[k]||''),e.equipment]})]}if(kind==='findings'){rows=[['No.','Chassis','Item','Type','Description','Status','Follow-up'],...db.findings.map(f=>[f.no,f.chassis,f.item||'',f.type,f.text,['RESOLVED','CLOSED'].includes(f.status)?'RESOLVED':'OPEN',f.followup])]}return rows}

oter><div class="no-print" style="position:fixed;right:12px;top:12px;background:white;padding:10px;border:1px solid #ccc;z-index:10"><button onclick="window.close();if(!window.closed)location.href=opener?opener.location.href:'./index.html'">← Back to App</button></div></body></html>`;let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print this report.');return}w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),350)}

function addPostCheck(){let el=document.getElementById('newPostCheck'),name=el.value.trim();if(!name)return alert('Enter a check name.');let existing=checkTemplates().find(x=>x.name.toLowerCase()===name.toLowerCase());if(existing){postCheckId=existing.id;render();return}let id='PC-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);db.checkTemplates.push({id,name,created:new Date().toISOString()});postCheckId=id;save();render();toast('Check added')}

c(x.driver)}<br><small>${esc(x.vehicle||'')} ${esc(x.chassis||'')}</small></td><td class="${x.result==='NOT OK'?'notok':''}">${esc(x.result)}</td><td>${esc(x.remarks||'—')}<br><small>${esc(formatDateTime(x.updated||x.created))}</small></td></tr>`).join('')}</tbody></table></section>`).join(''):'<p>No post session checks recorded for this session.</p>'}<footer>© 2026 Christian Singer · All rights reserved · ${esc(session)}</footer><div class="noprint"><button onclick="window.close()">← Back to App</button> <button onclick="window.print()">Print / Save PDF</button></div></body></html>`;let w=window.open('','_blank');if(!w)return alert('Please allow pop-ups to print the report.');w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),400)}

function backupPage(){return `<h2>Backup / Export</h2><p class="muted">© 2026 Christian Singer. All rights reserved. This application and its reports are intended for authorized use. Private inspection data remain stored locally on this device unless explicitly exported.</p><div class="good">All inspection changes are saved in this browser on this device. This is not cloud synchronization. To load your private event and master data, choose Restore JSON backup below.</div><div class="card"><h3>Complete backup</h3><p>Export JSON after each scrutineering block. Save to Files or external storage. JSON contains entries, master data, inspection results and findings.</p><div class="actions"><button class="primary" onclick="exportJSON()">Download complete JSON backup</button><button onclick="document.getElementById('restore').click()">Restore JSON backup</button><input class="hidden" id="restore" type="file" accept=".json,application/json" onchange="restoreJSON(this)"></div></div><div class="card"><h3>Excel for reporting</h3><p>Exports a formatted .xlsx with Event Summary, Car Inspection, Driver Equipment, Findings, Cars Master and Drivers Master. This is a standalone data export; it does not automatically update an existing V5 workbook.</p><button class="primary" onclick="exportExcel()">Download Excel (.xlsx)</button></div><div class="card"><h3>Storage check</h3><p>Last save: ${esc(db.savedAt?formatDateTime(db.savedAt):'not yet saved')}</p><button onclick="testStorage()">Test local persistence</button></div><div class="note">On iPad Safari, a file opened directly from Files may not persist data reliably. Test saving, closing, reopening and restoring a JSON backup before race use. A proper HTTPS-installed PWA is preferable for operational use.</div>`}function testStorage(){save();let r=localStorage.getItem(KEY);alert(r&&JSON.parse(r).entries.length===db.entries.length?'Local storage write/read succeeded in this session. Still test after browser restart.':'Local storage verification failed!')}function download(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}function exportJSON(){syncActiveEvent();download('BOSS_GP_ALL_EVENTS_V5_4_2_BACKUP.json',new Blob([JSON.stringify(db,null,2)],{type:'application/json'}))}async function restoreJSON(input){let f=input.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.cars)||!Array.isArray(d.drivers)||(!Array.isArray(d.entries)&&!Array.isArray(d.events)))throw Error('Invalid backup schema');if(!confirm('Replace all local data with backup '+f.name+'?'))return;db=d;normalizeEvents();save();go('dashboard');toast('Backup restored')}catch(e){alert('Restore failed: '+e.message)}}

function officialReportsPage(){let d=detections();return `<div class="card"><h3>Official Documents · A4 portrait</h3><p class="muted">Stewards-ready documents. All document numbers, dates, times and text can be edited before printing.</p><div class="grid"><button class="primary" onclick="officialForm('initial')">Initial Scrutineering Report</button><button class="primary" onclick="officialForm('authorisation')">Request for Authorisation</button><button class="primary" onclick="officialForm('detection')">+ Detection Report</button></div><h4>Spare cars for this event</h4><div class="line"><input id="spareChassis" list="allChassis" placeholder="Chassis number"><button onclick="addSpareCar()">+ Add Spare Car</button></div>${masterDatalists()}${spareCars().map((c,i)=>`<div class="line">${esc(c)} <button onclick="removeSpareCar(${i})">Remove</button></div>`).join('')}<h4>Saved Detection Reports (${d.length})</h4>${d.map(r=>`<div class="line"><span>${esc(r.documentNo||'No document no.')} · ${esc(r.session)} · #${esc(r.no)} · ${esc(r.date||'')}</span><button onclick="officialForm('detection','${esc(r.id)}')">Edit / PDF</button><button onclick="deleteDetection('${esc(r.id)}')">Delete</button></div>`).join('')||'<p class="muted">No detection reports recorded.</p>'}</div>`}
function addSpareCar(){let c=document.getElementById('spareChassis').value.trim();if(!c)return;let car=db.cars.find(x=>x.chassis.toLowerCase()===c.toLowerCase());if(!car)return alert('Choose a chassis from the vehicle master.');if(!spareCars().includes(car.chassis))spareCars().push(car.chassis);save();render()}

const defaultAuthorisation='In accordance with the FIA International Sporting Code and the applicable Sporting and Technical Regulations, authorisation is requested to carry out any technical checks and verifications considered necessary during the Event.\n\nThis may include the inspection, measurement, weighing, sealing, dismantling or verification of any competing vehicle or relevant component, as well as tyres, fuel, software, electronic systems, recorded data and documents. Competitors may be required to provide any items, data or information necessary for these checks.\n\nChecks may be carried out on any selected vehicle at any time during the Event, including before or after practice, qualifying or races. Any refusal to submit to an authorised check, or any non-compliance identified, will be reported to the Stewards.';

function officialForm(kind,id){let r=kind==='detection'&&id?detections().find(x=>x.id===id):null;let findings=db.findings||[];let existing=(db.officialDefaults||{})[kind]||{};let title=kind==='initial'?'TECHNICAL REPORT · Initial Scrutineering':kind==='authorisation'?'REQUEST FOR AUTHORISATION · Technical Checks during the Event':'DETECTION REPORT';let options=db.entries.map(e=>`<option value="${esc(e.no)}" ${r?.no===e.no?'selected':''}>#${esc(e.no)} · ${esc(e.driver)}</option>`).join('');let fopts=findings.map((f,i)=>`<option value="${i}">#${esc(f.no||'')} · ${esc(f.check||f.description||f.type||'Finding')}</option>`).join('');let body=kind==='detection'?`<label>Session</label><input id="ofSession" value="${esc(r?.session||'Qualifying')}"><label>Car / Driver</label><select id="ofNo" onchange="ofCarChanged()"><option value="">Choose car</option>${options}</select><label>Use existing finding (optional)</label><select id="ofFinding" onchange="ofFindingChanged()"><option value="">Independent incident</option>${fopts}</select><label>Regulation / Article</label><input id="ofReg" value="${esc(r?.regulation||'')}" placeholder="e.g. Art. 11.2 Sporting Regulations"><label>Facts / Description</label><textarea id="ofText" rows="6">${esc(r?.description||'')}</textarea><label>Number of annexes</label><input id="ofAnnexes" type="number" min="0" value="${esc(r?.annexes??0)}">`:kind==='authorisation'?`<label>Authorisation text</label><textarea id="ofText" rows="12">${esc(existing.text||defaultAuthorisation.replace(/\\n/g,'\n'))}</textarea>`:`<div class="note">Summary is calculated from event inspection records. The narrative is editable; verify all statuses before submitting to Stewards.</div><label>Report narrative</label><textarea id="ofText" rows="5">${esc(existing.text&& !/^\d+ cars are entered for initial scrutineering\./.test(existing.text)?existing.text:initialNarrative())}</textarea>`;let html=`<h2>${esc(title)}</h2><div class="card"><label>Document No.</label><input id="of
